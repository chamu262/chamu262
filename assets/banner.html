<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 360px; background: #15171D; color: #F3EFE7; font-family: 'Inter', Arial, sans-serif; position: relative; overflow: hidden; }
  .glow { position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(242,145,61,0.28), rgba(242,145,61,0) 65%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 40px 40px; }
  .wrap { position: absolute; left: 64px; top: 56px; right: 64px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #F2913D; }
  h1 { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; font-size: 58px; line-height: 1.05; margin: 14px 0 10px; }
  .tag { font-size: 22px; color: #B8BCC6; }
  .tag b { color: #F3EFE7; }
  .flow { position: absolute; left: 64px; bottom: 48px; display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 16px; }
  .step { border: 1.5px solid #343846; background: #1F222B; border-radius: 10px; padding: 9px 16px; color: #D9DCE3; }
  .step.you { border-color: #F2913D; color: #F2913D; }
  .arrow { color: #5C6273; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow">AI Automation Engineer · Forward-deployed · IT Ops</div>
    <h1>Chamudith Amarasinghe</h1>
    <div class="tag"><b>I build agents that run IT operations.</b> Humans approve every change.</div>
  </div>
  <div class="flow">
    <span class="step">agent finds it</span><span class="arrow">→</span>
    <span class="step">agent drafts the fix</span><span class="arrow">→</span>
    <span class="step you">you approve</span><span class="arrow">→</span>
    <span class="step">change runs</span>
  </div>
</body></html>
